<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Your next integration. Built in TypeScript.</title>
  <desc id="description">PolyAPI TypeScript project template with the original PolyAPI logo and brand colours. Workflows, artefacts, tests, and Flow tooling. The runtime follows schemas, webhooks, triggers, and functions.</desc>
  <!-- Brand palette sampled from the original logo: blue #3D77EE, red #E63F35, yellow #F9B528, green #2F9E4B. -->
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#566078"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111722"/>
      <stop offset="1" stop-color="#1B2031"/>
    </linearGradient>
    <linearGradient id="edge" x1="750" y1="72" x2="1198" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D77EE"/>
      <stop offset="0.34" stop-color="#E63F35"/>
      <stop offset="0.67" stop-color="#F9B528"/>
      <stop offset="1" stop-color="#2F9E4B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <path d="M1260 0H20C8.954 0 0 8.954 0 20V400C0 411.046 8.954 420 20 420H1260C1271.05 420 1280 411.046 1280 400V20C1280 8.954 1271.05 0 1260 0Z" stroke="#30384A" stroke-width="2"/>
  <rect x="674" y="20" width="580" height="380" fill="url(#grid)" opacity="0.4"/>
  <path d="M738 44H1136L1234 142V376H836L738 278V44Z" stroke="#333B51"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Original logo: https://polyapi.io/wp-content/uploads/2024/06/polyapi-logo-color-sml.webp; source saved as polyapi-logo.webp. Embedded to avoid external requests. -->
    <image id="polyapi-logo" x="56" y="34" width="172" height="38" href="data:image/webp;base64,"/>
    <path d="M247 42V64" stroke="#46516B"/>
    <text x="267" y="58" fill="#AAB4C9" font-size="12" font-weight="600" letter-spacing="2.2">TYPESCRIPT TEMPLATE</text>

    <text x="52" y="155" fill="#F4F5FA" font-size="57" font-weight="700" letter-spacing="-2.2">Your next integration.</text>
    <text x="52" y="221" font-size="57" font-weight="700" letter-spacing="-2.2"><tspan fill="#F4F5FA">Built in </tspan><tspan fill="#3D77EE">TypeScript.</tspan></text>
    <text x="56" y="269" fill="#B7C0D3" font-size="20">Workflows, artefacts, and tools to get you started.</text>

    <g font-size="13" font-weight="500">
      <rect x="56" y="318" width="108" height="32" rx="16" fill="#3D77EE" fill-opacity="0.1" stroke="#3D77EE" stroke-opacity="0.45"/>
      <circle cx="72" cy="334" r="3" fill="#3D77EE"/>
      <text x="83" y="339" fill="#DCE2F0">TypeScript</text>
      <rect x="174" y="318" width="78" height="32" rx="16" fill="#F9B528" fill-opacity="0.1" stroke="#F9B528" stroke-opacity="0.45"/>
      <circle cx="190" cy="334" r="3" fill="#F9B528"/>
      <text x="201" y="339" fill="#DCE2F0">pnpm</text>
      <rect x="262" y="318" width="82" height="32" rx="16" fill="#E63F35" fill-opacity="0.1" stroke="#E63F35" stroke-opacity="0.45"/>
      <circle cx="278" cy="334" r="3" fill="#E63F35"/>
      <text x="289" y="339" fill="#DCE2F0">Biome</text>
      <rect x="354" y="318" width="70" height="32" rx="16" fill="#2F9E4B" fill-opacity="0.1" stroke="#2F9E4B" stroke-opacity="0.45"/>
      <circle cx="370" cy="334" r="3" fill="#2F9E4B"/>
      <text x="381" y="339" fill="#DCE2F0">AVA</text>
    </g>
  </g>

  <rect x="756" y="82" width="448" height="278" rx="15" fill="#0B101A" opacity="0.45"/>
  <rect x="750" y="72" width="448" height="278" rx="15" fill="#171D2B" stroke="url(#edge)" stroke-opacity="0.65"/>
  <path d="M751 126H1197" stroke="#343D51"/>
  <circle cx="774" cy="99" r="4" fill="#3D77EE"/>
  <circle cx="790" cy="99" r="4" fill="#E63F35"/>
  <circle cx="806" cy="99" r="4" fill="#F9B528"/>
  <circle cx="822" cy="99" r="4" fill="#2F9E4B"/>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17">
    <text x="847" y="105" fill="#DCE2F0">your-project/</text>
    <path d="M785 148V302M785 164H802M785 210H802M785 256H802M785 302H802" stroke="#46516B" stroke-width="1.5"/>

    <g stroke-width="1.6" stroke-linejoin="round">
      <path d="M819 155H826L830 159H842V174H819Z" stroke="#3D77EE"/>
      <path d="M819 201H826L830 205H842V220H819Z" stroke="#E63F35"/>
      <path d="M819 247H826L830 251H842V266H819Z" stroke="#F9B528"/>
      <path d="M819 293H826L830 297H842V312H819Z" stroke="#2F9E4B"/>
    </g>
    <text x="858" y="171" fill="#EEF1F8">.agents/</text>
    <text x="858" y="217" fill="#EEF1F8">cli/</text>
    <text x="858" y="263" fill="#EEF1F8">designs/</text>
    <text x="858" y="309" fill="#EEF1F8">workflows/</text>
  </g>

  <path d="M1178 52L1185 59L1178 66L1171 59Z" fill="#E63F35"/>
  <path d="M724 340L730 346L724 352L718 346Z" fill="#F9B528"/>
  <circle cx="1214" cy="288" r="4" fill="#2F9E4B"/>
  <text x="975" y="388" text-anchor="middle" fill="#AAB4C9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2">SCHEMAS → WEBHOOKS → TRIGGERS → FUNCTIONS</text>
</svg>
